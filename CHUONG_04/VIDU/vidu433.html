<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        for(var i=1; i<=10; i++){
            document.write("Hello World <br>");
        }
        document.write("<br>");
        var computers=["Dell","HP","Asus","Acer","Macbook"];
        for (x in computers){
            document.write("&nbsp;")
            document.write(computers[x]);
        }
    </script>
</body>
</html>
