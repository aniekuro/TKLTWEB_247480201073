<html>
<body>
<script>
var LuaChon = prompt("Nhập số 1, 2, 3 để mở trang web:");

switch (LuaChon) {
    case "1":
        window.open("https://blu.edu.vn");
        break;

    case "2":
        window.open("https://ctu.edu.vn");
        break;

    case "3":
        window.open("https://vn.doc.com");
        break;

    default:
        window.open("https://meta.vn");
}
</script>
</body>
</html>
