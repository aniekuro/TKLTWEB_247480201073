<!DOCTYPE html>
<html>
<head>
<style>
h1 {
  background-color: rgb(141, 125, 36);
}

div {
  background-color: rgb(173, 230, 197);<!--thay doi màu nền cho div-->
}

p {
  background-color: rgb(255, 0, 13);<!--thay doi màu nền cho p-->
}
</style>
</head>
<body>

<h1>CSS background-color example!</h1>
<div>
This is a text inside a div element.
<p>This paragraph has its own background color.</p>
We are still in the div element.
</div>
<!--thay doi màu nền cho từng phần tử-->
</body>
</html>
