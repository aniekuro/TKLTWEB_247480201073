<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Học web chuẩn</title>
<style>
  /* Reset */
  * {
    margin: 0;
    padding: 0;
  }
  ul {
    list-style: none;
  }
  body {
    color: #383838;
    font-family: Helvetica,sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  .clearfix {
    zoom: 1;
  }
  .clearfix:after {
    clear: both;
    content: ".";
    display: block;
    height: 0;
    line-height: 0;
    visibility: hidden;
  }

  /* Layout */
  .examples {
    margin: 30px auto;
    width: 940px;
  }
  .examples h2 {
    font-size: 26px;
    margin-bottom: 30px;
    position: relative;
    text-align: center;
  }
  /* phần background trắng che line bên dưới */
  .examples h2 span {
    background-color: #ec0d0d;
    padding: 0 20px;
    position: relative;
    z-index: 1;
  }
  /* line của h2 */
  .examples h2:after {
    background-color: #1d0303;
    content: "";
    display: block;
    height: 1px;
    left: 0;
    position: absolute;
    top: 20px;
    width: 100%;
  }
  .examples .example-list li {
    float: left;
    margin-right: 6px;
    width: 250px; /*chiều rộng tấm hình*/
  }
  .examples .example-list li:nth-child(4n) {
    margin-right: 0;
  }
</style>
</head>
<body>
  <section class="examples">
    <h2><span>Great examples built with bootslander</span></h2>
    <ul class="example-list">
      <li><a href="./"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS0LTUXUQablzjJyI-t0aFc0EGqP8A4jx0CxGr5YsRSFw&s=10" alt=""></a></li>
      <li><a href="./"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS0LTUXUQablzjJyI-t0aFc0EGqP8A4jx0CxGr5YsRSFw&s=10" alt=""></a></li>
      <li><a href="./"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS0LTUXUQablzjJyI-t0aFc0EGqP8A4jx0CxGr5YsRSFw&s=10" alt=""></a></li>
      <li><a href="./"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQOR5GT7KY3WJ6nf_dsI1uxM90xrbUkcXjr1NV9bzsZ-g&s" alt=""></a></li>
    </ul>
  </section>
</body>
</html>
